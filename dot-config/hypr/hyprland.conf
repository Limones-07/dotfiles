####################
### Theme colors ###
####################

source = catppuccin-macchiato.conf

#################
### Variables ###
#################

$terminal = ghostty
$terminal_launch_args = +new-window
$polkit_agent = /usr/lib/hyprpolkitagent/hyprpolkitagent
$notification_daemon = mako
$imf = fcitx5 -rd
$clipboard_manager = clipse -listen
$wallpaper = hyprpaper

################
### Monitors ###
################

monitor = ,preferred,auto,1

#################
### Autostart ###
#################

#exec-once = $terminal
exec-once = $wallpaper
exec-once = $polkit_agent
exec-once = $imf
exec-once = $notification_daemon
exec-once = $clipboard_manager

#############################
### Environment Variables ###
#############################

#env = GTK_IM_MODULE,fcitx
#env = QT_IM_MODULE,fcitx
#env = SDL_IM_MODULE,fcitx
#env = XMODIFIERS,@im=fcitx

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_PICTURES_DIR,$HOME/Imagens

#####################
### Look And Feel ###
#####################

general {
  border_size = 1
  gaps_in = 4
  gaps_out = 10

  col.inactive_border = rgba(595959aa)
  col.active_border = rgba(33ccffee)

  no_focus_fallback = false

  resize_on_border = true

  allow_tearing = false

  layout = dwindle
}

decoration {
  rounding = 6

  active_opacity = 1.0
  inactive_opacity = 0.98
  fullscreen_opacity = 1.0

  #drop_shadow = false
  #shadow_range = 4
  #shadow_render_power = 3
  #col.shadow = rgba(1a1a1aee)
  #col.shadow = rgba(1a1a1a55)
  #shadow_offset = 0 0

  dim_inactive = false
  dim_strength = 0.15
    
  blur {
    enabled = false
    size = 8
    passes = 1
    ignore_opacity = false
    new_optimizations = true
    xray = false
    vibrancy = 0.1696
  }
}

animations {
  enabled = true

  bezier = myBezier, 0.05, 0.9, 0.1, 1.05

  animation = windows, 1, 7, myBezier
  animation = windowsOut, 1, 7, default, popin 80%
  animation = border, 1, 10, default
  animation = borderangle, 1, 8, default
  animation = fade, 1, 7, default
  animation = workspaces, 1, 6, default
}

dwindle {
  pseudotile = true
  preserve_split = true
}

master {
  new_status = master
}

misc {
  force_default_wallpaper = -1
  disable_hyprland_logo = false
}

#############
### Input ###
#############

input {
  kb_layout = us 
  kb_variant = intl 
  kb_model = 
  kb_options = 
  kb_rules = 

  numlock_by_default = true

  sensitivity = 0
  accel_profile = flat

  follow_mouse = 2

  focus_on_close = 0

  touchpad {
    disable_while_typing = false
    natural_scroll = false
    tap-to-click = true
  }
}

#gestures {
#  workspace_swipe = true
#  workspace_swipe_fingers = 3
#}

###################
### Keybindings ###
###################

$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal $terminal_launch_args
bind = $mainMod, W, killactive,
bind = $mainMod&ALT, Q, exit
bind = $mainMod&ALT, R, exec, hyprctl reload

bind = $mainMod&SHIFT, F, togglefloating,
bind = $mainMod&SHIFT, P, pseudo,
bind = $mainMod&SHIFT, J, togglesplit,
bind = $mainMod&SHIFT, L, fullscreen,

bind = , Print, exec, grimblast --notify --freeze copysave area
bind = SHIFT, Print, exec, grimblast --notify --cursor --freeze copysave screen

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, bracketleft, workspace, -1
bind = $mainMod, bracketright, workspace, +1

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = $mainMod, Tab, focuscurrentorlast
bind = $mainMod, grave, workspace, previous

bind = $mainMod, V, exec, $terminal --title=clipse -e clipse

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### Windows And Workspaces ###
##############################

#windowrulev2 = float, initialTitle:^(Picture-in-picture)$
#windowrulev2 = float, initialTitle:^(Picture-in-Picture)$
#windowrulev2 = pin, initialTitle:^(Picture-in-picture)$
#windowrulev2 = pin, initialTitle:^(Picture-in-Picture)$

#windowrulev2 = suppressevent maximize, class:.*

#windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

windowrule {
  name = clipse
  match:initial_title = clipse
  float = on
  size = 522 652
  move = ((monitor_w*1)-window_w-10) ((monitor_h*1)-window_h-10)
}

#windowrulev2 = float, class:(clipse)
#windowrulev2 = size 622 652, class:(clipse)
#windowrulev2 = move 100%-w-10 100%-w-10, class:(clipse)

##################
### My Configs ###
##################

cursor {
  no_warps = true
}

debug {
  full_cm_proto = true
}

