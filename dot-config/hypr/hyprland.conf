#################
### Variables ###
#################

source = ./variables.conf

################
### Monitors ###
################

monitor = , preferred, auto, 1

#################
### Autostart ###
#################

exec-once = $wallpaper
exec-once = $polkit_agent
exec-once = $imf
exec-once = $notification_daemon
exec-once = $clipboard_manager
exec-once = $sunset

#############################
### Environment Variables ###
#############################

#env = GTK_IM_MODULE,fcitx
#env = QT_IM_MODULE,fcitx
#env = SDL_IM_MODULE,fcitx
#env = XMODIFIERS,@im=fcitx

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_PICTURES_DIR,$HOME/Imagens

#####################
### Look And Feel ###
#####################

general {
  $borderSize = 1 #for use on window rules
  border_size = $borderSize

  gaps_in = 4
  $gapsOut = 9 #for use on window rules
  gaps_out = $gapsOut

  col.active_border = $lavender
  col.inactive_border = $overlay0

  layout = dwindle

  snap:enabled = true
}

decoration {
  rounding = 7

  active_opacity = 1.0
  inactive_opacity = 0.98
  fullscreen_opacity = 1.0

  blur {
    enabled = true
    new_optimizations = true
    xray = true
  }
}

animations {
  enabled = true

  bezier = hyperPolarize, 0.05, 0.9, 0.1, 1.05

  animation = windows, 1, 7, hyperPolarize
  animation = windowsOut, 1, 7, default, popin 80%
  animation = border, 1, 10, default
  animation = borderangle, 1, 8, default
  animation = fade, 1, 7, default
  animation = workspaces, 1, 6, default
}

dwindle {
  pseudotile = true
  precise_mouse_move = true
}

#############
### Input ###
#############

input {
  kb_layout = us 
  kb_variant = intl 

  numlock_by_default = true

  sensitivity = 0  #goes from -1.0 to 1.0
  accel_profile = flat

  follow_mouse = 2

  touchpad {
    disable_while_typing = false
    natural_scroll = false
    tap-to-click = true
    drag_lock = 1 #enabled with timeout
  }
}

gestures {
  gesture = 3, swipe, move
  gesture = 4, up, fullscreen
  gesture = 4, down, float
  gesture = 4, horizontal, workspace
}

################################
### Other behaviour settings ###
################################

misc {
  focus_on_activate = true #I might regret this...
  allow_session_lock_restore = true #it seems good(?...)
  force_default_wallpaper = 2
}

cursor {
  inactive_timeout = 30
  no_warps = true
}

####################
### Window rules ###
####################

windowrule {
  name = ghostty_opacity
  match:class = com.mitchellh.ghostty
  opacity = 0.90
  xray = off
}

windowrule {
  name = ghostty_opacity_special
  match:class = com.mitchellh.ghostty
  match:workspace = special:magic
  no_blur = on
  opacity = 0.75
}

windowrule {
  name = special_float
  match:workspace = special:magic
  float = on
  persistent_size = on
}

windowrule {
  name = clipse
  match:initial_title = clipse
  float = on
  pin = on
  size = 550 650
  move = (monitor_w-window_w-$gapsOut-$borderSize) \
         (monitor_h-window_h-$gapsOut-$borderSize)
}

###################
### Keybindings ###
###################

$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal $terminal_launch_args
bind = $mainMod, W, killactive,
bind = $mainMod&ALT, Q, exec, hyprshutdown
bind = $mainMod&ALT, R, exec, hyprctl reload
bind = $mainMod&SHIFT&ALT, Q, exit
bind = $mainMod, L, exec, $session_locker

bind = $mainMod&SHIFT, F, togglefloating,
bind = $mainMod&SHIFT, P, pseudo,
bind = $mainMod&SHIFT, J, togglesplit,
bind = $mainMod&SHIFT, L, fullscreen,

bindl = , Print, exec, grimblast --notify --freeze copysave area
bindl = SHIFT, Print, exec, grimblast --notify --cursor --freeze copysave screen

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, bracketleft, workspace, -1
bind = $mainMod, bracketright, workspace, +1

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = $mainMod, Tab, focuscurrentorlast
bind = $mainMod, dead_grave, workspace, previous

bind = $mainMod, V, exec, $terminal --title=clipse -e clipse

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

